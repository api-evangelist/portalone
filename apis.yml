name: PortalOne
description: >-
  PortalOne is a hybrid gaming platform that blends mobile games with live,
  interactive television-style entertainment, letting players compete inside
  shows and classic titles such as Atari's Breakout. Operated by PortalOne AS
  (Norway) and PortalOne, Inc. (United States), the company delivers its
  experience through native iOS and Android apps rather than a public developer
  platform. It is a consumer-facing entertainment product backed by Seedcamp and
  other venture investors; as of this profile PortalOne publishes no public API,
  SDK, developer portal, or API documentation.
